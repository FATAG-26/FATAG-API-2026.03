services:
  backend:
    build: ./backend-node
    command: ["node", "--watch", "src/server.js"]
    ports:
      - "8000:8000"
    environment:
      DATA_FILE: /data/verificacoes_bombas_tratado.json
    volumes:
      - ./backend-node/src:/app/src
      - ./data:/data:ro

  front-end:
    build: ./front-end/my-app
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./front-end/my-app:/my-app
      - /my-app/node_modules
    depends_on:
      - backend
