services:
  backend:
    build: ./backend-node
    command: ["node", "--watch", "src/server.js"]
    ports:
      - "8000:8000"
    environment:
      CSV_PATH: /data/verificacoes_bombas_2018.csv
    volumes:
      - ./backend-node/src:/app/src
      - ./data:/data:ro


  front-end:
    build: ./front-end/my-app
    ports:
       - "5173:5173"
    volumes:
       - ./front-end/my-app:/my-app
       - /my-app/node_modules
    depends_on:
       - backend